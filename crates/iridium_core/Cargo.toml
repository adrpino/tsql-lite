[package]
name = "iridium_core"
version.workspace = true
edition.workspace = true
description = "SQL Server-compatible Rust engine core for Iridium SQL"
license.workspace = true
repository = "https://github.com/adrpino/iridium-sql"
homepage = "https://github.com/adrpino/iridium-sql"
keywords = ["sql-server", "tds", "database", "wasm"]
categories = ["database", "web-programming"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["unbounded_depth"] }
bincode = { version = "2", features = ["serde"] }
thiserror = "1"
hex = "0.4"
regex = "1.12.3"
redb = "2.1"
uuid = { version = "1", features = ["v4", "serde"] }
parking_lot = "0.12"
dashmap = "6.1.0"
chrono = { version = "0.4", features = ["clock", "serde"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
md-5 = { version = "0.10", default-features = false }
sha1 = { version = "0.10", default-features = false }
sha2 = { version = "0.10", default-features = false }
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
uuid = { version = "1", features = ["js"] }
js-sys = "0.3"

[dev-dependencies]
winnow = "0.7"
tempfile = "3"
tiberius = { version = "0.12.3", default-features = false, features = ["tokio", "tds73", "chrono"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tokio-util = { version = "0.7", features = ["compat"] }
