[package]
name = "tsql-lite-core"
version.workspace = true
edition.workspace = true
description = "Embedded SQL Server-compatible T-SQL engine core in pure Rust"
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords = ["sql-server", "tsql", "tds", "database", "embedded"]
categories = ["database", "web-programming"]

[features]
default = ["checkpoint", "persistence"]
checkpoint = []
persistence = ["checkpoint", "dep:redb"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["unbounded_depth"] }
thiserror = "2"
hex = "0.4"
regex = "1.12.3"
redb = { version = "2.1", optional = true }
uuid = { version = "1", features = ["v4", "serde"] }
parking_lot = "0.12"
chrono = { version = "0.4", features = ["clock", "serde"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
md-5 = { version = "0.11", default-features = false }
sha1 = { version = "0.11", default-features = false }
sha2 = { version = "0.11", default-features = false }
aes-gcm = { version = "0.11", default-features = false, features = ["aes", "alloc"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
uuid = { version = "1", features = ["js"] }
js-sys = "0.3"

[dev-dependencies]
divan = "0.1"
winnow = "0.7"
tempfile = "3"
tiberius = { version = "0.12.3", default-features = false, features = ["tokio", "tds73", "chrono"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tokio-util = { version = "0.7", features = ["compat"] }

[[bench]]
name = "engine_bench"
harness = false
