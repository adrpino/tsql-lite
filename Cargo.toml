[workspace]
members = [
  "crates/tsql_lite_core",
  "crates/tsql_lite_wasm",
  "crates/tsql_lite_server",
  "crates/tsql_lite_server_test_support"
]
resolver = "2"

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/adrpino/tsql-lite"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"

[profile.bench]
opt-level = 3
lto = "fat"
codegen-units = 1

[profile.release-wasm]
inherits = "release"
opt-level = "z"
panic = "abort"
strip = true

