[package]
name = "tsql-lite-wasm"
version.workspace = true
edition.workspace = true
description = "WebAssembly bindings for tsql-lite"
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords = ["wasm", "sql-server", "tsql", "database"]
categories = ["database", "web-programming"]

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
serde_json = "1"
console_error_panic_hook = "0.1"
tsql-lite-core = { path = "../tsql_lite_core", version = "0.3.0" }
